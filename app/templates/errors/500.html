{% extends "base.html" %}
{% block title %}500 Server Error - Finance Tracker{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="mb-4">
    <i class="fa-solid fa-server fa-4x text-danger"></i>
  </div>
  <h1 class="display-5 fw-bold">500 - Internal Server Error</h1>
  <p class="lead text-muted mb-4">An unexpected error occurred while processing your financial request. The transaction was safely rolled back.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
    <i class="fa-solid fa-house me-2"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
