services:
  - type: web
    name: personal-finance-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.10
